name: Check scholarships

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: reminders
        name: Find reminders
        shell: bash
        run: |
          output=$(python scripts/check_scholarships.py)
          echo "json=$output" >> "$GITHUB_OUTPUT"

      - name: Open reminder issues
        uses: actions/github-script@v7
        env:
          REMINDERS: ${{ steps.reminders.outputs.json }}
        with:
          script: |
            const reminders = JSON.parse(process.env.REMINDERS || '[]');

            for (const reminder of reminders) {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100
              });

              const exists = issues.some(issue => issue.title === reminder.title);
              if (exists) continue;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: reminder.title,
                body: reminder.body
              });
            }
